<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Baseball Score Keeper</title>
  <meta name="description" content="A baseball score keeper application.">
  <meta property="og:title" content="baseball score keeper">
  <meta property="og:description" content="A baseball score keeper application.">
  <link rel="stylesheet" href="styles.css">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="scoreboard-container">
    
    <!-- Top Row Header -->
    <header class="top-row">
      <button class="icon-btn" id="share-btn" aria-label="Share Game Score" title="Share Game Score">
        <i class="fa-solid fa-share-nodes"></i>
      </button>
      
      <!-- Interactive Compact Timer Display -->
      <button type="button" class="timer-display" id="timer-display" aria-label="Game Clock: Tap to pause or resume" title="Tap to pause or resume">
        <span class="timer-status-badge" id="timer-status-badge">
          <i class="fa-solid fa-play" id="timer-icon"></i>
        </span>
        <span class="timer-digits" id="timer">00:00:00</span>
      </button>
      
      <button class="icon-btn" id="settings-btn" aria-label="Game Settings" title="Settings & Themes">
        <i class="fa-solid fa-gear"></i>
      </button>
    </header>

    <!-- Main Score Card -->
    <main class="score-card">
      <div class="scores">
        <button class="score-num" id="home-score" title="Tap or swipe up to add run; swipe down to remove">0</button>
        <span class="score-dash">-</span>
        <button class="score-num" id="away-score" title="Tap or swipe up to add run; swipe down to remove">0</button>
      </div>
      <div class="labels" id="team-labels-container">
        <span class="team-label" id="home-label" title="Click to set Home on offense">Home</span>
        <span class="team-label" id="away-label" title="Click to set Away on offense">Away</span>
        <!-- Physical Sliding Underline Indicator -->
        <div class="sliding-underline" id="batting-underline" aria-hidden="true"></div>
      </div>
    </main>

    <!-- Inning Transition / Side Retired Visual Indicator -->
    <div class="inning-transition-toast" id="inning-toast" role="status" aria-live="polite">
      <span class="toast-badge" id="toast-badge">3 OUTS</span>
      <span class="toast-text" id="toast-message">CHANGE SIDES</span>
    </div>

    <!-- Bottom Controls Row -->
    <footer class="bottom-row">
      <!-- Outs Selector Container -->
      <div class="outs-container" id="outs-container" title="Tap circle to set outs">
        <button type="button" class="out-circle" data-out="1" aria-label="Out 1"></button>
        <button type="button" class="out-circle" data-out="2" aria-label="Out 2"></button>
        <button type="button" class="out-circle" data-out="3" aria-label="Out 3"></button>
      </div>

      <!-- Inning Stepper Container -->
      <div class="inning-container" id="inning-container" title="Tap to advance half-inning; hold to step back">
        <span class="inning-num" id="inning-val" aria-label="Current Inning">1</span>
        <div class="inning-arrows">
          <button type="button" class="arrow-btn active" id="inning-up" aria-label="Top of Inning" title="Top of Inning">
            <i class="fa-solid fa-caret-up"></i>
          </button>
          <button type="button" class="arrow-btn" id="inning-down" aria-label="Bottom of Inning" title="Bottom of Inning">
            <i class="fa-solid fa-caret-down"></i>
          </button>
        </div>
      </div>
    </footer>

    <!-- Settings Rollout Drawer & Backdrop -->
    <div class="settings-backdrop" id="settings-backdrop" aria-hidden="true">
      <div class="settings-drawer" id="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="drawer-header">
          <div class="drawer-handle-bar"></div>
          <div class="drawer-title-row">
            <h2 id="settings-title"><i class="fa-solid fa-gear"></i> Settings</h2>
            <button type="button" class="close-drawer-btn" id="close-settings-btn" aria-label="Close Settings">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <div class="drawer-body">
          <!-- Themes Grid -->
          <div class="settings-group">
            <label class="group-label">Color Theme</label>
            <div class="themes-grid" id="themes-grid">
              <button type="button" class="theme-card active" data-theme="light">
                <div class="theme-palette-card light">
                  <span class="palette-swatch bg"></span>
                  <span class="palette-swatch card"></span>
                  <span class="palette-swatch accent"></span>
                </div>
                <span class="theme-title">Classic Light</span>
              </button>
              <button type="button" class="theme-card" data-theme="dark">
                <div class="theme-palette-card dark">
                  <span class="palette-swatch bg"></span>
                  <span class="palette-swatch card"></span>
                  <span class="palette-swatch accent"></span>
                </div>
                <span class="theme-title">Night Game</span>
              </button>
              <button type="button" class="theme-card" data-theme="ballpark">
                <div class="theme-palette-card ballpark">
                  <span class="palette-swatch bg"></span>
                  <span class="palette-swatch card"></span>
                  <span class="palette-swatch accent"></span>
                </div>
                <span class="theme-title">Ballpark Green</span>
              </button>
              <button type="button" class="theme-card" data-theme="royal">
                <div class="theme-palette-card royal">
                  <span class="palette-swatch bg"></span>
                  <span class="palette-swatch card"></span>
                  <span class="palette-swatch accent"></span>
                </div>
                <span class="theme-title">Royal Navy</span>
              </button>
              <button type="button" class="theme-card" data-theme="vintage">
                <div class="theme-palette-card vintage">
                  <span class="palette-swatch bg"></span>
                  <span class="palette-swatch card"></span>
                  <span class="palette-swatch accent"></span>
                </div>
                <span class="theme-title">Vintage Leather</span>
              </button>
            </div>
          </div>

          <!-- Preferences (Haptic Feedback) -->
          <div class="settings-group">
            <label class="group-label">Preferences</label>
            <div class="settings-toggle-row">
              <div class="toggle-text-block">
                <span class="toggle-title">Haptic Feedback</span>
                <span class="toggle-desc">Vibrate on taps, score changes & side flips</span>
              </div>
              <label class="apple-switch" title="Toggle haptic vibration">
                <input type="checkbox" id="haptic-toggle" checked />
                <span class="apple-slider"></span>
              </label>
            </div>
          </div>

          <!-- Team Names -->
          <div class="settings-group">
            <label class="group-label">Team Names</label>
            <div class="team-inputs-row">
              <div class="input-block">
                <label for="home-name-input">Home Team</label>
                <input type="text" id="home-name-input" value="Home" maxlength="16" autocomplete="off" />
              </div>
              <div class="input-block">
                <label for="away-name-input">Away Team</label>
                <input type="text" id="away-name-input" value="Away" maxlength="16" autocomplete="off" />
              </div>
            </div>
          </div>

          <!-- Game Clock -->
          <div class="settings-group">
            <label class="group-label">Game Clock</label>
            <div class="actions-row">
              <button type="button" class="action-btn" id="modal-timer-toggle-btn">
                <i class="fa-solid fa-pause" id="modal-timer-icon"></i>
                <span id="modal-timer-text">Pause Clock</span>
              </button>
              <button type="button" class="action-btn reset" id="modal-timer-reset-btn">
                <i class="fa-solid fa-rotate-left"></i>
                <span>Reset (00:00)</span>
              </button>
            </div>
          </div>

          <!-- Game Reset Actions -->
          <div class="settings-group">
            <label class="group-label">Score Management</label>
            <div class="actions-row">
              <button type="button" class="action-btn" id="clear-runs-btn">
                <i class="fa-solid fa-eraser"></i>
                <span>Reset Scores</span>
              </button>
              <button type="button" class="action-btn danger" id="reset-game-btn">
                <i class="fa-solid fa-arrows-rotate"></i>
                <span>Start New Game</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Share Menu Rollout Drawer & Backdrop -->
    <div class="settings-backdrop" id="share-backdrop" aria-hidden="true">
      <div class="settings-drawer share-drawer" id="share-drawer" role="dialog" aria-modal="true" aria-labelledby="share-title">
        <div class="drawer-header">
          <div class="drawer-handle-bar"></div>
          <div class="drawer-title-row">
            <h2 id="share-title"><i class="fa-solid fa-share-nodes"></i> Share Game</h2>
            <button type="button" class="close-drawer-btn" id="close-share-btn" aria-label="Close Share Menu">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <div class="drawer-body">
          <!-- Summary Type Selection -->
          <div class="settings-group">
            <label class="group-label">Format</label>
            <div class="summary-type-grid" id="summary-type-grid">
              <button type="button" class="summary-card active" data-format="basic">
                <i class="fa-solid fa-calculator"></i>
                <div class="summary-card-info">
                  <span class="summary-card-name">Quick Score</span>
                  <span class="summary-card-desc">Team runs</span>
                </div>
              </button>
              <button type="button" class="summary-card" data-format="standard">
                <i class="fa-solid fa-baseball-bat-ball"></i>
                <div class="summary-card-info">
                  <span class="summary-card-name">Game Status</span>
                  <span class="summary-card-desc">Score, inning & outs</span>
                </div>
              </button>
              <button type="button" class="summary-card" data-format="broadcast">
                <i class="fa-solid fa-bullhorn"></i>
                <div class="summary-card-info">
                  <span class="summary-card-name">Live Sportscast</span>
                  <span class="summary-card-desc">Play-by-play announcer call</span>
                </div>
              </button>
            </div>
          </div>

          <!-- Live Preview Box -->
          <div class="settings-group">
            <div class="preview-header-row">
              <label class="group-label">Preview</label>
              <div class="preview-actions">
                <button type="button" class="copy-preview-btn" id="copy-preview-btn" title="Copy preview text">
                  <i class="fa-solid fa-copy"></i> <span>Copy</span>
                </button>
              </div>
            </div>
            <div class="share-preview-box" id="share-preview-box">
              <pre id="share-preview-text">Home 0 - 0 Away</pre>
            </div>
          </div>

          <!-- Sharing Channels (No WhatsApp, No X/Post) -->
          <div class="settings-group">
            <label class="group-label">Send Score</label>
            <div class="share-channels-grid clean-channels-grid">
              <button type="button" class="share-channel-btn native" id="share-native-btn" title="Share via device">
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
                <span>Share...</span>
              </button>
              <button type="button" class="share-channel-btn sms" id="share-sms-btn" title="Send as text message">
                <i class="fa-solid fa-comment-sms"></i>
                <span>Message</span>
              </button>
              <button type="button" class="share-channel-btn email" id="share-email-btn" title="Share via email">
                <i class="fa-solid fa-envelope"></i>
                <span>Email</span>
              </button>
              <button type="button" class="share-channel-btn copy" id="share-copy-btn" title="Copy score to clipboard">
                <i class="fa-solid fa-copy"></i>
                <span>Copy Score</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
